name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned canonical replay
        env:
          AI_OS_CONTEXT_SHA: cc5fc109f73c938fbf976f34ea777ce52c791777
        run: python -m pip install --disable-pip-version-check "git+https://github.com/GK-studio-JP/ai-os-context.git@${AI_OS_CONTEXT_SHA}"
      - run: python -m unittest -v
