name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned canonical replay
        env:
          AI_OS_CONTEXT_SHA: 0c550bab684fdccc45f23c92923b6dd753173a19
        run: python -m pip install --disable-pip-version-check "git+https://github.com/GK-studio-JP/ai-os-context.git@${AI_OS_CONTEXT_SHA}"
      - run: python -m unittest -v
