name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      AI_OS_KERNEL_SHA: e26ae08c24d3fe271e0fb612084c12e1b148f34e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checkout control-plane registry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: GK-studio-JP/ai-os-kernel
          ref: ${{ env.AI_OS_KERNEL_SHA }}
          path: kernel
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Resolve control-plane dependencies
        id: control_plane
        run: python kernel/control_plane_lock.py export-github --lock kernel/registry/control-plane-lock.json --output "$GITHUB_OUTPUT"
      - name: Verify Runtime source provenance matches Kernel registry
        env:
          AI_OS_RUNTIME_SHA: ${{ steps.control_plane.outputs.runtime_sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          lock = json.loads(Path("runtime-source.json").read_text(encoding="utf-8"))
          if lock.get("canonical_repository") != "GK-studio-JP/ai-os-runtime":
              raise SystemExit("runtime-source canonical repository is not the governed Runtime")
          if lock.get("canonical_commit") != os.environ["AI_OS_RUNTIME_SHA"]:
              raise SystemExit(
                  "runtime-source canonical commit does not match the Kernel registry Runtime SHA"
              )
          print("RUNTIME_SOURCE_REGISTRY_OK", os.environ["AI_OS_RUNTIME_SHA"])
          PY
      - name: Checkout pinned canonical Runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: GK-studio-JP/ai-os-runtime
          ref: ${{ steps.control_plane.outputs.runtime_sha }}
          path: .runtime-canonical
          persist-credentials: false
      - name: Verify Runtime copy drift
        run: python scripts/check_runtime_drift.py --canonical-root .runtime-canonical
      - name: Install pinned canonical replay
        env:
          AI_OS_CONTEXT_SHA: ${{ steps.control_plane.outputs.context_sha }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "git+https://github.com/GK-studio-JP/ai-os-context.git@${AI_OS_CONTEXT_SHA}"
          echo "AI_OS_PROVENANCE kernel_sha=${AI_OS_KERNEL_SHA} runtime_sha=${{ steps.control_plane.outputs.runtime_sha }} context_sha=${AI_OS_CONTEXT_SHA}"
      - run: python -m unittest -v
