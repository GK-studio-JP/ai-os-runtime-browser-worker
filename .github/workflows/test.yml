name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Resolve pinned Runtime source
        id: runtime_source
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          lock = json.loads(Path("runtime-source.json").read_text(encoding="utf-8"))
          repository = lock.get("canonical_repository")
          commit = lock.get("canonical_commit")
          if repository != "GK-studio-JP/ai-os-runtime":
              raise SystemExit(f"unexpected canonical repository: {repository!r}")
          if not isinstance(commit, str) or re.fullmatch(r"[0-9a-f]{40}", commit) is None:
              raise SystemExit("canonical commit must be an immutable lowercase 40-hex SHA")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"repository={repository}\n")
              output.write(f"commit={commit}\n")
          PY
      - name: Checkout pinned canonical Runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.runtime_source.outputs.repository }}
          ref: ${{ steps.runtime_source.outputs.commit }}
          path: .runtime-canonical
          persist-credentials: false
      - name: Verify Runtime copy drift
        run: python scripts/check_runtime_drift.py --canonical-root .runtime-canonical
      - name: Install pinned canonical replay
        env:
          AI_OS_CONTEXT_SHA: 0c550bab684fdccc45f23c92923b6dd753173a19
        run: python -m pip install --disable-pip-version-check "git+https://github.com/GK-studio-JP/ai-os-context.git@${AI_OS_CONTEXT_SHA}"
      - run: python -m unittest -v
