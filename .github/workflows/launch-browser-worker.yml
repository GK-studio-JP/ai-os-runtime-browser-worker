name: browser worker launcher preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PLAN_URL: https://github.com/GK-studio-JP/ai-os-scheduler/releases/download/browser-worker-dispatch/browser-worker-plan.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve public Scheduler dispatch
        run: |
          set -euo pipefail
          out="$(python browser_worker_launcher.py --plan-url "$PLAN_URL" --print-dispatch)"
          if [ "$out" = "NO_DISPATCH" ]; then
            echo "No Browser Worker dispatch."
          else
            printf '%s\\n' "$out"
          fi

      - name: Explain production launch ownership
        run: |
          cat <<'EOF'
          Production Browser Worker launch is owned by GK-studio-JP/browser-agent.

          Canonical path:
          Scheduler public browser-worker-dispatch Release
            -> browser-agent ai-os-browser-worker.yml poller
            -> [browser-launch] Issue in GK-studio-JP/browser-agent
            -> supabase-browser-session.yml
            -> Browser Agent session
            -> browser_worker_launcher.py Gemini / CLAIM / RESULT loop

          This repository does not create Browser Agent sessions and does not require
          AI_OS_CONTROL_TOKEN, SUPABASE_SECRET_KEY, TAILSCALE_AUTHKEY, or
          BROWSER_PROFILE_KEY.
          EOF
