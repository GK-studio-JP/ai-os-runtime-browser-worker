name: launch browser worker

on:
  workflow_dispatch:
    inputs:
      scheduler_run_id:
        description: Scheduler browser-worker-plan run ID; blank means latest successful run
        required: false
        type: string
      max_steps:
        description: Maximum Gemini/Browser Agent action turns
        required: false
        default: '80'
        type: string

permissions:
  contents: read

concurrency:
  group: browser-worker-launcher
  cancel-in-progress: false

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve Scheduler dispatch
        id: dispatch
        env:
          AI_OS_CONTROL_TOKEN: ${{ secrets.AI_OS_CONTROL_TOKEN }}
          SCHEDULER_RUN_ID: ${{ inputs.scheduler_run_id }}
        run: |
          set -euo pipefail
          test -n "$AI_OS_CONTROL_TOKEN" || {
            echo "::error::AI_OS_CONTROL_TOKEN is required to read Scheduler artifacts."
            exit 1
          }
          export GITHUB_TOKEN="$AI_OS_CONTROL_TOKEN"
          args=(--print-dispatch)
          if [ -n "$SCHEDULER_RUN_ID" ]; then
            args+=(--scheduler-run-id "$SCHEDULER_RUN_ID")
          fi
          out="$(python browser_worker_launcher.py "${args[@]}")"
          if [ "$out" = "NO_DISPATCH" ]; then
            echo "has_dispatch=false" >> "$GITHUB_OUTPUT"
            echo "No Browser Worker dispatch in the selected Scheduler run."
          else
            echo "has_dispatch=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve Browser Agent session
        if: steps.dispatch.outputs.has_dispatch == 'true'
        id: browser
        env:
          AI_OS_CONTROL_TOKEN: ${{ secrets.AI_OS_CONTROL_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL" || { echo "::error::SUPABASE_URL is required."; exit 1; }
          test -n "$SUPABASE_SECRET_KEY" || { echo "::error::SUPABASE_SECRET_KEY is required."; exit 1; }
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import time
          import urllib.request

          base = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SECRET_KEY"]
          token = os.environ["AI_OS_CONTROL_TOKEN"]
          supa_headers = {
              "apikey": key,
              "Authorization": f"Bearer {key}",
              "Content-Type": "application/json",
          }

          def request(method, url, headers=None, value=None):
              body = None if value is None else json.dumps(value).encode()
              req = urllib.request.Request(url, data=body, method=method)
              for k, v in (headers or {}).items():
                  req.add_header(k, v)
              req.add_header("User-Agent", "ai-os-browser-worker-launch-workflow")
              if body is not None:
                  req.add_header("Content-Type", "application/json")
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
                  return json.loads(raw.decode()) if raw else None

          def sessions():
              return request(
                  "GET",
                  f"{base}/rest/v1/browser_relay_sessions?select=session_id,state,heartbeat_at,ended_at,created_at,last_error&order=created_at.desc&limit=10",
                  supa_headers,
              ) or []

          now = dt.datetime.now(dt.timezone.utc)
          usable = None
          for row in sessions():
              if row.get("state") != "ready" or row.get("ended_at"):
                  continue
              heartbeat = str(row.get("heartbeat_at") or "").replace("Z", "+00:00")
              try:
                  age = (now - dt.datetime.fromisoformat(heartbeat)).total_seconds()
              except ValueError:
                  continue
              if age <= 90:
                  usable = str(row["session_id"])
                  break

          if usable is None:
              before = {str(row["session_id"]) for row in sessions()}
              issue_url = "https://api.github.com/repos/kj2whvbzjn-hue/browser-agent/issues"
              request(
                  "POST",
                  issue_url,
                  {
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
                  {
                      "title": "[browser-launch] AI OS Browser Worker",
                      "body": "Browser session launch trigger only. No browser commands or page data are stored in this Issue.",
                  },
              )
              deadline = time.time() + 240
              while time.time() < deadline:
                  for row in sessions():
                      sid = str(row["session_id"])
                      if sid not in before and row.get("state") == "ready" and not row.get("ended_at"):
                          usable = sid
                          break
                  if usable:
                      break
                  time.sleep(2)

          if not usable:
              raise SystemExit("Browser Agent session did not become ready.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"session_id={usable}\n")
          print(f"Browser Agent session ready: {usable}")
          PY

      - name: Run Gemini Browser Worker
        if: steps.dispatch.outputs.has_dispatch == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.AI_OS_CONTROL_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SCHEDULER_RUN_ID: ${{ inputs.scheduler_run_id }}
          MAX_STEPS: ${{ inputs.max_steps }}
          SESSION_ID: ${{ steps.browser.outputs.session_id }}
        run: |
          set -euo pipefail
          args=(--session-id "$SESSION_ID" --max-steps "${MAX_STEPS:-80}")
          if [ -n "$SCHEDULER_RUN_ID" ]; then
            args+=(--scheduler-run-id "$SCHEDULER_RUN_ID")
          fi
          python browser_worker_launcher.py "${args[@]}"
