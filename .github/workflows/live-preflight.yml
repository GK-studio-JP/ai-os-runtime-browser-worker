name: live runtime preflight

on:
  workflow_dispatch:
  schedule:
    - cron: '47 * * * *'
  push:
    paths:
      - 'runtime.py'
      - 'test_runtime.py'
      - 'process.json'
      - '.github/workflows/live-preflight.yml'

permissions:
  contents: read

concurrency:
  group: runtime-live-preflight
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ github.token }}
      AI_OS_CONTEXT_SHA: cc5fc109f73c938fbf976f34ea777ce52c791777
      AI_OS_SCHEDULER_SHA: f68a81f44409e3103b27838b4ad89e3021b25249
      AI_OS_KERNEL_SHA: d472370b5dd61010ac610904d5a79f0f7686c0ac
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GK-studio-JP/ai-os-context
          ref: ${{ env.AI_OS_CONTEXT_SHA }}
          path: context
      - uses: actions/checkout@v4
        with:
          repository: GK-studio-JP/ai-os-scheduler
          ref: ${{ env.AI_OS_SCHEDULER_SHA }}
          path: scheduler
      - uses: actions/checkout@v4
        with:
          repository: GK-studio-JP/ai-os-kernel
          ref: ${{ env.AI_OS_KERNEL_SHA }}
          path: kernel
      - name: Record provenance
        run: echo "AI_OS_PROVENANCE runtime_sha=${GITHUB_SHA} context_sha=${AI_OS_CONTEXT_SHA} scheduler_sha=${AI_OS_SCHEDULER_SHA} kernel_sha=${AI_OS_KERNEL_SHA}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e context
      - name: Build projection
        run: aios-context snapshot --repo GK-studio-JP/ai-bulletin-board --state open --default-process PROC-BULLETIN --output-dir projection
      - name: Build dispatch
        run: python scheduler/scheduler.py plan --view projection/scheduler-view.json --manifest projection/manifest.json --limit 1 --output dispatch/plan.json
      - name: Kernel validate
        run: python kernel/kernel.py validate-dispatch --registry kernel/registry/processes.json --plan dispatch/plan.json --output dispatch/kernel-validation.json
      - name: Build boot
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          plan=json.loads(Path("dispatch/plan.json").read_text())
          check=json.loads(Path("dispatch/kernel-validation.json").read_text())
          assert check["valid"]
          out=Path("worker"); out.mkdir(parents=True,exist_ok=True)
          boot={"schema":"ai-os-worker-boot:v1","authoritative":False,"persist_required":True,
                "source_plan_fingerprint":plan.get("fingerprint"),
                "dispatch_count":plan.get("dispatch_count",0),"dispatch":None,"capsule":None}
          if plan["dispatches"]:
              d=plan["dispatches"][0]; c=d["context"]
              shutil.copyfile(Path("projection")/c["capsule"],out/"capsule.json")
              boot["dispatch"]=d
              boot["capsule"]={"path":"capsule.json","fingerprint":c["fingerprint"],
                               "through_comment_id":c.get("through_comment_id")}
          (out/"boot.json").write_text(json.dumps(boot,indent=2,sort_keys=True)+"\n")
          PY
      - name: Fresh replay
        shell: bash
        run: |
          mkdir -p runtime
          issue="$(python -c 'import json; p=json.load(open("dispatch/plan.json")); print(str(p["dispatches"][0]["task"]).lstrip("#") if p["dispatches"] else "")')"
          if [[ -n "$issue" ]]; then
            aios-context replay --repo GK-studio-JP/ai-bulletin-board --issue "$issue" --output runtime/fresh.json
          else
            printf '{}\n' > runtime/fresh.json
          fi
      - name: Runtime preflight
        shell: bash
        run: |
          if [[ -f worker/capsule.json ]]; then
            python runtime.py preflight --boot worker/boot.json --capsule worker/capsule.json --fresh runtime/fresh.json --worker-id runtime-preflight --worker-actor github-actions[bot] --output runtime/preflight.json
          else
            python runtime.py preflight --boot worker/boot.json --fresh runtime/fresh.json --worker-id runtime-preflight --worker-actor github-actions[bot] --output runtime/preflight.json
          fi
      - name: Validate preflight
        run: |
          python - <<'PY'
          import json
          v=json.load(open("runtime/preflight.json"))
          assert v["schema"]=="ai-os-runtime-preflight:v1"
          assert v["authoritative"] is False
          assert v["persist_required"] is True
          assert v["status"] in {"IDLE","CLAIM_REQUIRED","READY","WAIT","STALE_CONTEXT","STOP"}
          print("RUNTIME_PREFLIGHT_OK",v["status"],v.get("task"))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ai-os-runtime-preflight
          path: |
            dispatch/
            worker/
            runtime/
          retention-days: 7
